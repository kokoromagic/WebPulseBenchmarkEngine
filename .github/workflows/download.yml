name: Download File

on:
  workflow_dispatch:
    inputs:
      url:
        description: "File URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download file
        run: |
          mkdir -p download
          cd download
          curl -L "${{ github.event.inputs.url }}" -O

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: download/*
